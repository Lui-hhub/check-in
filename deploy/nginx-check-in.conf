server {
    server_name xn--btvt3a.online www.xn--btvt3a.online;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI authenticates /media requests, then delegates the file body here.
    location ^~ /__protected-media/ {
        internal;
        alias /home/ubuntu/check-in/backend/data/media/;
    }

    # Face-api.js weights are static binary files. Serve them directly from
    # disk so model downloads do not occupy a Next.js connection.
    location ^~ /models/ {
        alias /home/ubuntu/check-in/frontend/public/models/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/xn--btvt3a.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--btvt3a.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name xn--btvt3a.online www.xn--btvt3a.online;
    return 301 https://$host$request_uri;
}
